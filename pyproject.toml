[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-announcements"
version = "1.0.0"
description = "Black Diamond Hub app: one-tap spoken announcements on Sonos and Alexa speakers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk[ha]>=0.18,<1",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-announcements"

[project.entry-points."blackdiamondhub.plugins"]
announcements = "announcements.plugin:spec"

[tool.setuptools.packages.find]
include = ["announcements", "announcements.*"]

[tool.setuptools.package-data]
announcements = [
    "templates/**/*",
    "static/**/*",
]
